<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - CashTasks</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="container confirm-box">
        <img src="assets/images/logo.png" alt="CashTasks" style="max-width: 180px;">

        <div class="success-icon">🔑</div>
        <h1>Redefinir Senha</h1>
        <p>Clique no botão abaixo para redefinir sua senha no aplicativo.</p>
        <p class="info">Você será redirecionado para o CashTasks.</p>

        <a href="cashtasks://reset-password" class="btn">Redefinir Senha</a>

        <div class="deep-link">
            <p>ou copie e cole no navegador:</p>
            <code>cashtasks://reset-password</code>
        </div>
    </div>

    <script>
        // Tentar abrir o app automaticamente após 2 segundos
        setTimeout(function() {
            window.location.href = "cashtasks://reset-password";
        }, 2500);
    </script>
</body>
</html>
